name: windows-check
# Temporary, fork only: runs the test suite on Windows for each branch listed in the matrix.
on:
  push:
    branches: [ci/windows-check]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [master, feat/linux-b2-container-db]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Tests (same command as release.yml)
        run: cargo test --workspace --no-fail-fast
